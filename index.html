<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Quick Links Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
  <div class="dashboard-container">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="user-name-container">
        <label for="username-input">Nama Anda:</label>
        <input type="text" id="username-input" placeholder="Masukkan nama..." />
      </div>
      
      <div class="top-controls">
        <button id="theme-toggle-btn" class="btn-secondary">☀️ Light Mode</button>
      </div>
    </header>

    <!-- Greeting Section -->
    <section class="greeting-section">
      <h1 id="greeting-text">Selamat Pagi!</h1>
      <p id="clock-text">00.00.00</p>
      <p id="date-text">Senin, 1 Januari 2026</p>
    </section>

    <!-- Main Grid Layout (2 Card Khusus Career Links) -->
    <main class="dashboard-grid-2">
      
      <!-- Card 1: International Company -->
      <section class="card">
        <h2>🌐 International Company Links</h2>
        <form id="add-intl-form">
          <input type="text" id="intl-title-input" placeholder="Nama Website (misal: LinkedIn)" required>
          <input type="url" id="intl-url-input" placeholder="URL (https://...)" required>
          <button type="submit" class="btn-orange">Tambah Link</button>
        </form>
        <ul id="intl-links-list" class="links-list"></ul>
      </section>

      <!-- Card 2: National Company -->
      <section class="card">
        <h2>🇮🇩 National Company Links</h2>
        <form id="add-nat-form">
          <input type="text" id="nat-title-input" placeholder="Nama Website (misal: JobStreet)" required>
          <input type="url" id="nat-url-input" placeholder="URL (https://...)" required>
          <button type="submit" class="btn-yellow">Tambah Link</button>
        </form>
        <ul id="nat-links-list" class="links-list"></ul>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
