<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Quick Links Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-default">
  <div class="dashboard-container">
    
    <!-- Top Bar: Theme Toggle, Background Selector & Custom Name -->
    <header class="top-bar">
      <div class="user-name-container">
        <label for="username-input">Nama Anda:</label>
        <input type="text" id="username-input" placeholder="Masukkan nama..." />
      </div>
      
      <div class="top-controls">
        <div class="bg-selector-container">
          <label for="bg-selector">Background:</label>
          <select id="bg-selector">
            <option value="bg-default">Default / Clean</option>
            <option value="bg-gradient">Gradient Elegant</option>
            <option value="bg-industrial">Petroleum / Engineering</option>
            <option value="bg-custom">Custom Image URL</option>
          </select>
        </div>
        <input type="url" id="bg-url-input" placeholder="Paste URL gambar..." style="display: none;" />
        <button id="theme-toggle-btn" class="btn-secondary">🌙 Dark Mode</button>
      </div>
    </header>

    <!-- Greeting Section -->
    <section class="greeting-section">
      <h1 id="greeting-text">Selamat Pagi!</h1>
      <p id="clock-text">00:00:00</p>
      <p id="date-text">Senin, 1 Januari 2026</p>
    </section>

    <!-- Main Layout (Hanya Quick Links Career) -->
    <main class="dashboard-single">
      <section class="card quick-links-card">
        <h2>🔗 Quick Links Career</h2>
        <div class="career-links-container">
          <a href="https://www.linkedin.com/jobs" target="_blank" class="career-link-btn international-btn">
            🌐 International Company Career
          </a>
          <a href="https://www.jobstreet.co.id" target="_blank" class="career-link-btn national-btn">
            🇮🇩 National Company Career
          </a>
        </div>
      </section>
    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
